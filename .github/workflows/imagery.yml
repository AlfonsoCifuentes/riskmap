# ================================================================
# RiskMap — Image Acquisition & CV Detection (runs on GitHub Actions)
# ================================================================
# Acquires satellite/webcam images → runs CV detection → stores signals
# Schedule: every 6 hours (heavier, uses more compute)
# ================================================================

name: "🛰️ Image Acquisition & CV"

on:
  schedule:
    - cron: '30 */6 * * *'   # every 6 hours, offset by 30 min
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
  COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
  NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}

jobs:
  imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Fail fast on an unreachable/over-quota DB before installing ~2 GB of
      # CV dependencies that the run would never get to use.
      - name: Preflight — database reachable
        id: preflight
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary
          python scripts/db_preflight.py

      - name: Install dependencies
        run: |
          pip install requests Pillow \
                      ultralytics opencv-python-headless \
                      torch torchvision geopy

      - name: Init schema
        run: python -m src.database.schema_init

      - name: Acquire free imagery
        run: python -m src.pipeline.acquire_images
        timeout-minutes: 15

      - name: Capture public camera frames (experimental)
        run: python -m src.pipeline.capture_cameras
        timeout-minutes: 6
        continue-on-error: true

      - name: Run CV detection
        run: python -m src.pipeline.detect
        timeout-minutes: 12

      # Runs even when acquisition/detection failed: skipping it lets the image
      # table grow unbounded, which inflates the next run's transfer volume.
      - name: Retention cleanup
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: python -m src.database.retention
