name: Lint JavaScript

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Run ESLint (static JS)
        run: |
          npm run lint
      - name: Extract inline JS from templates and lint
        run: |
          python tools/extract_js_from_templates.py
          npm run lint:html
      - name: Lint (fix mode) - optional
        if: github.event_name == 'pull_request'
        run: |
          npm run lint:fix
      - name: Check inline JS syntax in HTML templates
        run: |
          node tools/check_js_with_node.js "src/web/templates/about.html"
          for file in src/web/templates/*.html; do
            node tools/check_js_with_node.js "$file" || exit 1
          done
