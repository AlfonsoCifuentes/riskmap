# ================================================================
# RiskMap — Data Ingestion Pipeline (runs on GitHub Actions)
# ================================================================
# Ingests RSS feeds + NewsAPI → NLP analysis → stores in Neon Postgres
# Schedule: every 2 hours
# ================================================================

name: "📡 Data Ingestion Pipeline"

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:          # manual trigger

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # public repo = free Actions minutes

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      # Fail fast on an unreachable/over-quota DB before installing torch and
      # transformers for a run that would die on its first query.
      - name: Preflight — database reachable
        id: preflight
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary
          python scripts/db_preflight.py

      - name: Install dependencies
        run: |
          pip install requests feedparser newspaper3k \
                      beautifulsoup4 lxml transformers torch sentencepiece \
                      groq geopy python-dotenv pydantic

      - name: Init schema
        run: python -m src.database.schema_init

      - name: Run ingestion
        run: python -m src.pipeline.ingest
        timeout-minutes: 15

      - name: Run NLP enrichment
        run: python -m src.pipeline.enrich
        timeout-minutes: 15

      # Runs even when ingestion/enrichment failed, so a partial failure does
      # not leave the tables growing untrimmed until the next green run.
      - name: Run retention cleanup
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: python -m src.database.retention
