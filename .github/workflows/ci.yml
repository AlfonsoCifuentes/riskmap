name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      # Lint only the code the v2 recovery owns. The legacy src/ tree is linted
      # incrementally as modules are migrated (see audit addendum B5).
      - name: Lint (ruff)
        run: ruff check api src/core src/ai/model_registry.py tests/unit

      # Strict type-check the pure-logic core modules (stdlib-only, no DB).
      # Scoped + follow-imports=silent so we gate the showcase logic without
      # dragging in the not-yet-typed DB/legacy tree (gated incrementally).
      - name: Type-check (mypy, src/core pure modules)
        run: >-
          mypy --follow-imports=silent
          src/core/relevance.py src/core/risk.py src/core/geo.py
          src/core/forecasting.py src/core/dedup.py src/core/events.py
          src/core/enrichment.py src/core/cameras.py src/core/alerts.py
          src/core/safety_brief.py

      # Fast, dependency-light unit tests (no DB, no heavy ML deps).
      - name: Unit tests
        run: pytest tests/unit --cov=api --cov-report=term-missing
