name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      # Lint only the code the v2 recovery owns. The legacy src/ tree is linted
      # incrementally as modules are migrated (see audit addendum B5).
      - name: Lint (ruff)
        run: ruff check api tests/unit

      # Fast, dependency-light unit tests (no DB, no heavy ML deps).
      - name: Unit tests
        run: pytest tests/unit --cov=api --cov-report=term-missing
