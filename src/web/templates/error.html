<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ Error - Riskmap A.I.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: #0a0f2c; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0a0f2c 0%, #1a2040 40%, #2a3558 80%, #3a4a70 100%);
            min-height: 100vh;
            color: #e8eaed;
            display: flex; justify-content: center; align-items: center;
        }

        .error-container {
            text-align: center; padding: 3rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            max-width: 520px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .error-icon {
            font-size: 4rem; margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .error-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem; font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ef4444, #f87171);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-message {
            font-size: 1.05rem; color: rgba(255,255,255,0.7);
            margin-bottom: 2rem; line-height: 1.6;
        }

        .error-actions {
            display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
        }

        .btn-home {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #034CA3, #1565C0);
            color: #fff; text-decoration: none;
            border-radius: 12px; font-weight: 600; font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(3,76,163,0.5);
            box-shadow: 0 4px 20px rgba(3,76,163,0.3);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(3,76,163,0.5);
        }

        .btn-back {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8); text-decoration: none;
            border-radius: 12px; font-weight: 500; font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateY(-2px);
        }

        .brand-link {
            display: block; margin-top: 2rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem; color: rgba(255,255,255,0.3);
            text-decoration: none; letter-spacing: 2px;
        }
        .brand-link:hover { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="error-title">Error</h1>
        <p class="error-message">{{ Error if Error else "Ha ocurrido un error inesperado en el sistema de inteligencia geopolítica." }}</p>
        <div class="error-actions">
            <a href="/" class="btn-home">🏠 Volver al Dashboard</a>
            <a onclick="history.back()" class="btn-back">← Página Anterior</a>
        </div>
        <a href="/" class="brand-link">🗺️ RISKMAP A.I.</a>
    </div>
</body>
</html>
