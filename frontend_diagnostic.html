<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Diagnostics - RiskMap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #00ff88;
        }
        .error { border-left-color: #ff4444; }
        .loading { border-left-color: #ffaa00; }
        .success { border-left-color: #00ff88; }
        pre {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        #results {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Frontend API Diagnostics</h1>
    <p>Testing the API endpoints that the dashboard relies on...</p>
    
    <div class="test-section loading" id="status-test">
        <h3>📊 Status API Test</h3>
        <div id="status-result">Testing...</div>
    </div>
    
    <div class="test-section loading" id="hero-test">
        <h3>🎯 Hero Article API Test</h3>
        <div id="hero-result">Testing...</div>
    </div>
    
    <div class="test-section loading" id="articles-test">
        <h3>📰 Articles API Test</h3>
        <div id="articles-result">Testing...</div>
    </div>
    
    <div class="test-section loading" id="dom-test">
        <h3>🔧 DOM Elements Test</h3>
        <div id="dom-result">Testing...</div>
    </div>
    
    <div class="test-section" id="console-errors">
        <h3>🚨 Console Errors</h3>
        <div id="error-log">Monitoring...</div>
    </div>

    <script>
        // Capture console errors
        let errorLog = [];
        const originalError = console.error;
        console.error = function(...args) {
            errorLog.push(args.join(' '));
            originalError.apply(console, args);
            updateErrorLog();
        };

        function updateErrorLog() {
            const errorDiv = document.getElementById('error-log');
            if (errorLog.length === 0) {
                errorDiv.innerHTML = '<span style="color: #00ff88;">No errors detected ✓</span>';
            } else {
                errorDiv.innerHTML = '<pre>' + errorLog.join('\n') + '</pre>';
                document.getElementById('console-errors').className = 'test-section error';
            }
        }

        // Test Status API
        async function testStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('status-test').className = 'test-section success';
                document.getElementById('status-result').innerHTML = `
                    <strong>✓ Success!</strong><br>
                    Status: ${response.status}<br>
                    Articles: ${data.total_articles}<br>
                    Regions in conflict: ${data.regions_in_conflict}<br>
                    <pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>
                `;
            } catch (error) {
                document.getElementById('status-test').className = 'test-section error';
                document.getElementById('status-result').innerHTML = `
                    <strong>✗ Error:</strong><br>
                    ${error.message}
                `;
            }
        }

        // Test Hero Article API
        async function testHero() {
            try {
                const response = await fetch('/api/hero-article');
                const data = await response.json();
                
                document.getElementById('hero-test').className = 'test-section success';
                document.getElementById('hero-result').innerHTML = `
                    <strong>✓ Success!</strong><br>
                    Status: ${response.status}<br>
                    Has article: ${data.article ? 'Yes' : 'No'}<br>
                    Title: ${data.article?.title?.substring(0, 100)}...<br>
                    Image: ${data.article?.image ? 'Yes' : 'No'}<br>
                    <pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>
                `;
            } catch (error) {
                document.getElementById('hero-test').className = 'test-section error';
                document.getElementById('hero-result').innerHTML = `
                    <strong>✗ Error:</strong><br>
                    ${error.message}
                `;
            }
        }

        // Test Articles API
        async function testArticles() {
            try {
                const response = await fetch('/api/articles?limit=5');
                const data = await response.json();
                
                document.getElementById('articles-test').className = 'test-section success';
                document.getElementById('articles-result').innerHTML = `
                    <strong>✓ Success!</strong><br>
                    Status: ${response.status}<br>
                    Articles count: ${data.articles ? data.articles.length : 0}<br>
                    First article: ${data.articles?.[0]?.title?.substring(0, 100)}...<br>
                    <pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>
                `;
            } catch (error) {
                document.getElementById('articles-test').className = 'test-section error';
                document.getElementById('articles-result').innerHTML = `
                    <strong>✗ Error:</strong><br>
                    ${error.message}
                `;
            }
        }

        // Test DOM Elements
        function testDOM() {
            const heroSection = document.getElementById('hero-article-section');
            const mosaicSection = document.getElementById('news-mosaic-section');
            
            document.getElementById('dom-test').className = 'test-section success';
            document.getElementById('dom-result').innerHTML = `
                <strong>DOM Elements Check:</strong><br>
                Hero section exists: ${heroSection ? 'Yes ✓' : 'No ✗'}<br>
                Mosaic section exists: ${mosaicSection ? 'Yes ✓' : 'No ✗'}<br>
                Current page title: ${document.title}<br>
                Template comment present: ${document.documentElement.innerHTML.includes('DASHBOARD_BUENO_LOADED') ? 'Yes ✓' : 'No ✗'}
            `;
        }

        // Run all tests
        async function runTests() {
            console.log('🔍 Starting frontend diagnostics...');
            
            await testStatus();
            await testHero();
            await testArticles();
            testDOM();
            
            setTimeout(updateErrorLog, 1000);
            
            console.log('🔍 Diagnostics complete!');
        }

        // Start tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
